name = "roworld"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# запросы /ws и /api/* сначала идут в worker, остальное — статика
run_worker_first = ["/ws", "/api/*", "/health"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

